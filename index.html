<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños ❤️</title>
    <link rel="icon" href="Barbie.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: auto;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            background: url('https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg?semt=ais_hybrid&w=740') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(to bottom, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.1) 100%),
                url('fotoJhoy.png') center center / contain no-repeat;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            opacity: 0.65;
            animation: fondoZoom 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @supports (-webkit-touch-callout: none) {
            body {
                background-attachment: scroll;
            }
        }

        @keyframes fondoZoom {
            0%   { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* ── Confetti ── */
        #confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            opacity: 0.9;
            animation: confettiFall linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.2;
            }
        }

        /* ── Glassmorphism Card ── */
        .birthday-card {
            position: relative;
            z-index: 10;
            max-width: 520px;
            width: 90%;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 32px;
            padding: 40px 32px 32px;
            box-shadow:
                0 20px 60px rgba(214, 51, 132, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            animation: cardEntrance 1s ease-out forwards;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(40px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ── Barbie icon ── */
        .barbie-icon {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: contain;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(214, 51, 132, 0.3);
            animation: spin 6s linear infinite;
            transition: transform 0.3s;
        }

        .barbie-icon:hover {
            transform: scale(1.12) rotate(-10deg);
            box-shadow: 0 12px 36px rgba(214, 51, 132, 0.5);
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── Greeting ── */
        .greeting {
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            font-weight: 700;
            color: #d63384;
            text-shadow:
                0 0 12px rgba(214, 51, 132, 0.35),
                0 0 30px rgba(214, 51, 132, 0.15);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .greeting-sub {
            font-size: 1rem;
            font-weight: 300;
            color: rgba(214, 51, 132, 0.8);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d63384, transparent);
            margin: 12px auto 16px;
            border-radius: 2px;
        }

        /* ── Quote ── */
        .quote {
            font-family: 'Dancing Script', cursive;
            font-size: 1.15rem;
            color: #a8326f;
            background: rgba(255, 255, 255, 0.35);
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 16px;
            backdrop-filter: blur(4px);
        }

        /* ── Photo thumbnail inside card ── */
        .photo-thumb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            margin: 8px 0 12px;
            transition: transform 0.3s;
        }

        .photo-thumb:hover {
            transform: scale(1.08);
        }

        /* ── Floating text bubbles ── */
        #bubbles-text {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .text-bubble {
            position: absolute;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            color: #d63384;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(214, 51, 132, 0.15);
            animation: floatText 8s ease-in-out forwards;
            white-space: nowrap;
        }

        @keyframes floatText {
            0%   { opacity: 0; transform: scale(0.5) translateY(0); }
            40%  { opacity: 1; transform: scale(1.05) translateY(-40px); }
            100% { opacity: 0; transform: scale(0.9) translateY(-100px); }
        }

        /* ── Music button ── */
        #play-music {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 22px;
            border-radius: 50px;
            background: linear-gradient(135deg, #d63384, #a8326f);
            color: #fff;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(214, 51, 132, 0.35);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        #play-music:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 24px rgba(214, 51, 132, 0.5);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .birthday-card {
                padding: 28px 20px 24px;
                width: 92%;
            }
            .greeting {
                font-size: 2rem;
            }
            .barbie-icon {
                width: 80px;
                height: 80px;
            }
            .photo-thumb {
                width: 80px;
                height: 80px;
            }
            .text-bubble {
                font-size: 0.95rem;
                white-space: normal;
                max-width: 65vw;
            }
            body::before {
                background-size: cover;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 0;
            }
            .birthday-card {
                padding: 24px 16px 20px;
                border-radius: 24px;
            }
            .greeting {
                font-size: 1.6rem;
            }
            .greeting-sub {
                font-size: 0.85rem;
                margin-bottom: 14px;
            }
            .barbie-icon {
                width: 64px;
                height: 64px;
                margin-bottom: 12px;
            }
            .photo-thumb {
                width: 64px;
                height: 64px;
            }
            .quote {
                font-size: 0.95rem;
                padding: 8px 14px;
            }
            .divider {
                margin: 8px auto 12px;
            }
            .text-bubble {
                font-size: 0.85rem;
                max-width: 55vw;
                padding: 6px 14px;
            }
            #play-music {
                top: 12px;
                right: 12px;
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 360px) {
            .greeting {
                font-size: 1.3rem;
            }
            .barbie-icon {
                width: 52px;
                height: 52px;
            }
            .photo-thumb {
                width: 52px;
                height: 52px;
            }
            .greeting-sub {
                font-size: 0.75rem;
            }
            .quote {
                font-size: 0.85rem;
                padding: 6px 12px;
            }
            .birthday-card {
                padding: 18px 12px 16px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="confetti-container"></div>
    <div id="bubbles-text"></div>

    <div class="birthday-card">
        <img src="Barbie.ico" alt="Barbie" class="barbie-icon">
        <div class="greeting">¡Feliz Cumpleaños!</div>
        <div class="greeting-sub">vistima ❤️</div>
        <div class="divider"></div>
        <img src="fotoJhoy.png" alt="Jhoy" class="photo-thumb">
        <div class="quote">Eres una gran persona y nenita dx</div>
    </div>

    <button id="play-music">🎵 Activar música</button>
    <audio id="bg-music" src="happyBirthday.mp3" loop></audio>

    <script>
        // ── Confetti ──
        (function () {
            const container = document.getElementById('confetti-container');
            const colors = ['#d63384', '#ff6b9d', '#ff99b6', '#ffd700', '#c084fc', '#f472b6', '#fb7185', '#e879f9'];
            const count = window.innerWidth < 480 ? 40 : 80;
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const size = 6 + Math.random() * 8;
                piece.style.width = size + 'px';
                piece.style.height = (size * (0.4 + Math.random() * 0.6)) + 'px';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDuration = (6 + Math.random() * 10) + 's';
                piece.style.animationDelay = Math.random() * 10 + 's';
                piece.style.opacity = 0.6 + Math.random() * 0.4;
                container.appendChild(piece);
            }
        })();

        // ── Floating text bubbles ──
        const messages = [
            "Eres la más nenita que conozco ❤️",
            "Que la pases super bien! 🌟",
            "Eres alguien especial 💕",
            "Vistima 🥰",
            "NeverSayGoodBye 💖",
            "Ya estas vieja dx 💫",
            "NU'EST 😍",
            "Lagañas 💫",
            "Bañate ✨",
            "Para que veas que me acorde de ti 💭",
            "lol 💘"
        ];

        function createTextBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'text-bubble';
            bubble.innerText = messages[Math.floor(Math.random() * messages.length)];
            const left = Math.random() * 80 + 10;
            const top = Math.random() * 80 + 10;
            bubble.style.left = left + 'vw';
            bubble.style.top = top + 'vh';
            const container = document.getElementById('bubbles-text');
            container.appendChild(bubble);
            setTimeout(() => {
                const rect = bubble.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    bubble.style.left = (window.innerWidth - rect.width - 10) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    bubble.style.top = (window.innerHeight - rect.height - 10) + 'px';
                }
                if (rect.left < 0) bubble.style.left = '10px';
                if (rect.top < 0) bubble.style.top = '10px';
            }, 10);
            setTimeout(() => bubble.remove(), 8000);
        }

        const bubbleInterval = window.innerWidth < 480 ? 900 : 500;
        setInterval(createTextBubble, bubbleInterval);

        // ── Audio ──
        const audio = document.getElementById('bg-music');
        const btn = document.getElementById('play-music');
        audio.volume = 0.4;
        btn.addEventListener('click', function () {
            audio.play();
            btn.style.display = 'none';
        });
    </script>
</body>
</html>
